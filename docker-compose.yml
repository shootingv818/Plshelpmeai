version: '3.8'

services:
  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: iva-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iva-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "IvaRedis2024!"

  # Master Server
  master:
    build:
      context: .
      dockerfile: Dockerfile
      target: master
    container_name: iva-master
    ports:
      - "5000:5000"
      - "7000:7000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000;https://+:7000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/iva-scanner.db
      - ConnectionStrings__Redis=redis:6379,password=IvaRedis2024!
      - Worker__HeartbeatTimeout=00:02:00
      - Worker__TaskLeaseTimeout=00:02:00
      - TaskDistribution__ChunkSize=100
      - Logging__LogLevel__Default=Information
    depends_on:
      - redis
    volumes:
      - master_logs:/app/logs
      - master_data:/app/data
    networks:
      - iva-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Clients (scalable)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Master__BaseUrl=http://master:5000
      - Master__ApiKey=docker-deployment-key-2024
      - Worker__MaxConcurrentTasks=2
      - Worker__HeartbeatInterval=00:00:30
      - Worker__WorkingDirectory=/app/temp
      - Logging__LogLevel__Default=Information
    depends_on:
      - master
    volumes:
      - worker_logs:/app/logs
      - worker_temp:/app/temp
    networks:
      - iva-network
    restart: unless-stopped
    deploy:
      replicas: 2
    scale: 2

  # nginx Load Balancer (optional)
  nginx:
    image: nginx:alpine
    container_name: iva-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - master
    networks:
      - iva-network
    restart: unless-stopped

  # Redis Commander (Web UI for Redis)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: iva-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:IvaRedis2024!
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - iva-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  master_logs:
    driver: local
  master_data:
    driver: local
  worker_logs:
    driver: local
  worker_temp:
    driver: local
  nginx_logs:
    driver: local

networks:
  iva-network:
    driver: bridge